<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Management</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="visibility: hidden;">
  <p id="access-message"></p>

  <!-- Shared Admin Navigation -->
  <aside class="sidebar">
    <h2>🛡️ Admin Panel</h2>

    <nav>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="customers.html" class="active">👥 Customers</a>
      <a href="sellers.html">🏪 Sellers</a>
      <a href="products.html">📦 Products</a>
      <a href="categories.html">🏷️ Categories</a>
      <a href="super-dashboard.html">👑 Super Admin</a>
      <a href="#" class="logout-link logout-btn">🚪 Logout</a>
    </nav>
  </aside>

  <!-- Customer Management -->
  <main class="main-content">

    <header class="page-header">
      <div>
        <h1>Customer Management</h1>
        <span style="color:#64748b;">View and moderate shopper accounts</span>
      </div>
    </header>

    <section class="card">
      <input
        type="search"
        id="customer-search"
        class="search-input"
        placeholder="Search customers by name or email..."
        aria-label="Search customers"
      >

      <table>
        <thead>
          <tr>
            <th>Customer ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Orders & Spent</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="customers-table-body">
          <tr>
            <td colspan="6" style="color:#64748b;">Loading customer records...</td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>
  <script src="js/admin.js"></script>
</body>
</html>
