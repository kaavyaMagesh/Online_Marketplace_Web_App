<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management</title>
    <link rel="stylesheet" href="css/admin.css">
</head>

<body style="visibility: hidden;">
    <p id="access-message"></p>

    <aside class="sidebar">
        <h2>🛡️ Admin Panel</h2>

        <nav>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="customers.html">👥 Customers</a>
            <a href="sellers.html">🏪 Sellers</a>
            <a href="products.html">📦 Products</a>
            <a href="categories.html" class="active">🏷️ Categories</a>
            <a href="super-dashboard.html">👑 Super Admin</a>
            <a href="#" class="logout-link logout-btn">🚪 Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Category Management</h1>
                <span style="color:#64748b;">Create and manage marketplace catalog categories</span>
            </div>
            <button type="button" id="add-category-btn" class="btn btn-success">
                + Add Category
            </button>
        </header>

        <section class="card">
            <input
                type="search"
                id="category-search"
                class="search-input"
                placeholder="Search categories by name..."
                aria-label="Search categories"
            >

            <table>
                <thead>
                    <tr>
                        <th>Category ID</th>
                        <th>Category Name</th>
                        <th>Description</th>
                        <th>Products</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="category-table-body">
                    <tr>
                        <td colspan="5" style="color:#64748b;">Loading categories...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
