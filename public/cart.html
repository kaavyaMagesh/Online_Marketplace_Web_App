<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodsPlatz | Shopping Cart</title>
    <meta name="description" content="View and manage products in your GoodsPlatz shopping cart.">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/common.js" defer></script>
    <script src="js/cart.js" defer></script>
</head>
<body>
    <header id="site-header"></header>

    <main class="section">
        <h1>Your Shopping Cart</h1>

        <!-- Feedback Alert Container -->
        <div id="cart-alert-container" aria-live="polite"></div>

        <!-- Main Cart Container (Populated dynamically by cart.js) -->
        <div id="cart-container" aria-live="polite">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading your cart…</p>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
</body>
</html>
