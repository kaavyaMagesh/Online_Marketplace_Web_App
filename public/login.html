<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodsPlatz | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/common.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>
    <header id="site-header"></header>

    <main class="form-container">
        <h1>Welcome Back!</h1>
        <p>Log in to access your GoodsPlatz account.</p>

        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com" value="customer@marketplace.com" required autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" value="Marketplace@123" required autocomplete="current-password">

            <button class="primary-button" type="submit" id="login-submit">Login</button>
            <p id="form-message" class="form-message" aria-live="polite"></p>
        </form>

        <p>New here? <a href="register.html">Create an account</a></p>
    </main>

    <div id="site-footer"></div>
</body>
</html>
